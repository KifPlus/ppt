<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Site Not Found</title>
  <style>
    /* minimal reset, clean slate */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0f15;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #eef2f6;
      line-height: 1.5;
    }

    .card {
      max-width: 680px;
      width: 100%;
      background: #131a24;
      border-radius: 2.5rem;
      padding: 3rem 2.5rem;
      box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.03);
      text-align: center;
      transition: transform 0.2s ease;
    }

    /* subtle glow */
    .card:hover {
      transform: scale(1.005);
    }

    .glitch-icon {
      font-size: 6rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(110, 190, 255, 0.6);
      margin-bottom: 0.25rem;
      line-height: 1.1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.1em;
    }

    .glitch-icon span {
      display: inline-block;
      animation: pulse 2.4s infinite ease-in-out;
    }

    .glitch-icon span:nth-child(2) {
      animation-delay: 0.3s;
      opacity: 0.9;
    }

    .glitch-icon span:nth-child(3) {
      animation-delay: 0.6s;
      opacity: 0.8;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.96); }
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-top: 0.5rem;
      margin-bottom: 1rem;
      color: #ffffff;
    }

    .divider {
      width: 80px;
      height: 4px;
      background: linear-gradient(90deg, #3b82f6, #a855f7, #3b82f6);
      border-radius: 4px;
      margin: 1.5rem auto 1.75rem;
      background-size: 200% 100%;
      animation: shimmer 3s infinite linear;
    }

    @keyframes shimmer {
      0% { background-position: 0% 0; }
      100% { background-position: 200% 0; }
    }

    p {
      font-size: 1.15rem;
      color: #9aa8b9;
      margin-bottom: 0;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    /* tiny footer */
    .tiny-note {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #4e5c6e;
      letter-spacing: 0.4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }

    .tiny-note span {
      font-size: 0.9rem;
    }

    /* mobile fine-tune */
    @media (max-width: 480px) {
      .card {
        padding: 2.2rem 1.6rem;
        border-radius: 2rem;
      }

      .glitch-icon {
        font-size: 4.4rem;
      }

      h1 {
        font-size: 1.7rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- four-oh-four built with spans for a touch of motion -->
    <div class="glitch-icon">
      <span>4</span><span>0</span><span>4</span>
    </div>

    <h1>Site not found</h1>
    <div class="divider"></div>

    <p>
      The page you’re looking for doesn’t exist, was removed, or is temporarily unavailable.
    </p>

    <div class="tiny-note">
      <span>⛔</span> 404 — not the page you're looking for
    </div>
  </div>
</body>
</html>
